worldbank:
  page: https://www.worldbank.org/en/research/commodity-markets
  prices:
    dap: {column: "DAP", label: "DAP (phosphate fertilizer)", unit: "US$ per tonne"}
    urea: {column: "Urea", label: "Urea (nitrogen fertilizer)", unit: "US$ per tonne"}
    potash: {column: "Potassium chloride", label: "Potash", unit: "US$ per tonne"}
    phosphate_rock: {column: "Phosphate rock", label: "Phosphate rock", unit: "US$ per tonne"}
    crude: {column: "Crude oil, average", label: "Crude oil (average of three benchmarks)", unit: "US$ per barrel"}
    wheat: {column: "Wheat, US HRW", label: "Wheat (US hard red winter)", unit: "US$ per tonne"}
    maize: {column: "Maize", label: "Maize (corn)", unit: "US$ per tonne"}
  indices:
    food: {column: "Food", label: "World food prices", unit: "index (2010 = 100)"}
    fertilizers: {column: "Fertilizers", label: "World fertilizer prices", unit: "index (2010 = 100)"}
    energy: {column: "Energy", label: "World energy prices", unit: "index (2010 = 100)"}

boc:
  series:
    FXUSDCAD: {label: "Canadian dollars per US dollar", unit: "CAD per USD"}
    FXMXNCAD: {label: "Canadian dollars per Mexican peso", unit: "CAD per MXN"}
  start: "2019-01-01"

cdm:
  base: https://agriculture.canada.ca/atlas/data_donnees/canadianDroughtMonitor/data_donnees/geoJSON/areasofDrought/
  first_year: 2023
  # Approximate agricultural zones of the Prairie provinces: south of 54°N between
  # straight-line longitudes. Documented as an approximation on the site.
  zones:
    AB: {label: "Alberta (south of 54°N)", bbox: [-120.0, 49.0, -110.0, 54.0]}
    SK: {label: "Saskatchewan (south of 54°N)", bbox: [-110.0, 49.0, -101.4, 54.0]}
    MB: {label: "Manitoba (south of 54°N)", bbox: [-101.4, 49.0, -95.2, 54.0]}

us_growing:
  # US states that supply most of Canada's imported fresh fruit and vegetables.
  states:
    CA: {fips: "06", label: "California", why: "lettuce, strawberries, broccoli, oranges"}
    AZ: {fips: "04", label: "Arizona", why: "winter lettuce and leafy greens"}
    FL: {fips: "12", label: "Florida", why: "winter tomatoes, peppers and citrus"}
    WA: {fips: "53", label: "Washington", why: "apples and pears"}
  crop_alerts: [Freeze, Frost, Hard Freeze, Extreme Cold, Excessive Heat, Extreme Heat, Heat, Flood, Flash Flood, High Wind, Red Flag, Fire, Dust Storm, Winter Storm, Tropical Storm, Hurricane]
