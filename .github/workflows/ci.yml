# Tests for every pull request and push: pipeline rules, model regression, type check and build.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Pipeline tests
        working-directory: pipeline
        run: |
          pip install -r requirements.txt
          python -m pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Stress-test regression against the pinned legacy page
        run: npm test
      - name: Type check and build
        run: npm run build
